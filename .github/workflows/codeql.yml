# Análise de segurança do código (Python do motor e TypeScript das funções).
name: codeql
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  analisar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        linguagem: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.linguagem }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
