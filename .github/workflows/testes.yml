# Testes do motor, das regras de acesso (RLS) num Postgres 16 e das regras da função de usuários.
name: testes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  motor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = imagem do motor hoje; 3.14 = prova antes de subir a imagem (Dependabot #113)
        python: ["3.12", "3.14"]
    name: motor (${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install openpyxl==3.1.5 anthropic==1.13.0   # Excel (comitê, cargas .xlsx) e IA do Radar (mesmas versões da imagem)
      - run: python -m unittest discover -s tests -q
  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste-local
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: teste-local
      PGDATABASE: sb
    steps:
      - uses: actions/checkout@v7
      - name: Aplicar o banco (imitação do Supabase + migrações, e a última de novo)
        run: |
          createdb sb
          for f in supabase/testes/stub_supabase.sql $(ls supabase/migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -q -f "$f" > /dev/null
          done
          psql -v ON_ERROR_STOP=1 -q -f "$(ls supabase/migrations/*.sql | sort | tail -1)" > /dev/null
      - run: python3 supabase/testes/testar_rls.py
  funcoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --experimental-strip-types --test supabase/functions/admin-usuarios/regras.test.ts supabase/functions/api/regras.test.ts supabase/functions/l/regras.test.ts supabase/functions/assistente/regras.test.ts supabase/functions/cobranca/regras.test.ts supabase/functions/cobranca/demonstrativo.test.ts supabase/functions/retorno-mensageria/regras.test.ts supabase/functions/relatorios/regras.test.ts supabase/functions/emails/regras.test.ts supabase/functions/gravacoes/regras.test.ts supabase/functions/voz-arquivos/regras.test.ts supabase/functions/simular_fluxo_voz/regras.test.ts supabase/functions/_compartilhado/servidor.test.ts site/duas-etapas/duasEtapasLogica.test.ts site/speech/speech.test.ts site/importador/importador.test.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - run: deno check supabase/functions/*/index.ts      # tipos de todas as Edge Functions (como no Supabase)
      - run: deno test -A supabase/functions/cobranca/demonstrativo_pdf_test.ts   # o PDF do demonstrativo
      - name: o arquivo único de cada função (o que é colado no Supabase) inicia no Deno
        run: |
          mkdir -p /tmp/juntas
          for d in supabase/functions/*/; do
            f=$(basename "$d"); [ -f "$d/index.ts" ] || continue
            python3 scripts/juntar_funcao.py "$f" > "/tmp/juntas/$f.ts"   # falha se dois arquivos declaram o mesmo nome
            deno check --no-config "/tmp/juntas/$f.ts"
          done
