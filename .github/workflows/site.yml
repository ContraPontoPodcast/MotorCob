# Site motorcob.online (site/): instala pelo package-lock.json, confere o lint, os tipos e os testes e monta o build
# estático do Netlify. Roda só quando algo em site/ (ou este arquivo) muda.
name: site
on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test            # regras do Fluxo do agente (site/fluxo) e componentes (src/**/*.test.tsx)
      - name: as duas etapas do site são cópia exata de site/duas-etapas (fonte testada)
        run: |
          diff <(tail -n +2 src/components/duasEtapasLogica.ts) duas-etapas/duasEtapasLogica.ts
          diff <(tail -n +2 src/components/DuasEtapas.tsx) duas-etapas/DuasEtapas.tsx
      - run: npm run build
      - name: o build tem o index.html, o sitemap e o robots
        run: test -f build/client/index.html && test -f build/client/sitemap.xml && test -f build/client/robots.txt
      - name: o build tem a CSP do Netlify (_headers) com os scripts inline por hash
        run: grep -q "Content-Security-Policy: default-src 'self'; script-src 'self' 'sha256-" build/client/_headers
