# Publica a imagem do motor no Artifact Registry do Google Cloud a cada push no main (a VM baixa às 05:20,
# ou na hora com: sudo systemctl start motorcob-atualizar). Sem chave guardada: Workload Identity Federation.
# Projeto, provedor WIF e conta de serviço não são segredos: ficam aqui (variáveis GCP_* do repositório, se
# existirem, têm prioridade).
name: imagem
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: imagem
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      IMAGEM: southamerica-east1-docker.pkg.dev/${{ vars.GCP_PROJETO || 'motorcob' }}/motorcob/motor
    steps:
      - uses: actions/checkout@v5
      - name: Montar a imagem
        run: docker build -t "$IMAGEM:${GITHUB_SHA::12}" -t "$IMAGEM:latest" .
      - name: Testes dentro da imagem (somente leitura, sem privilégios)
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint sh -w /tmp "$IMAGEM:latest" -c 'python3 -m unittest discover -s /app/tests -t /app -q'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/1066520898298/locations/global/workloadIdentityPools/github/providers/github' }}
          service_account: ${{ vars.GCP_SA_CI || 'motorcob-ci@motorcob.iam.gserviceaccount.com' }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Publicar
        run: |
          gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet
          docker push --all-tags "$IMAGEM"
