# Site motorcob.online (sistema) e motorcx.com.br (site público) no Netlify: um só site estático, modo SPA do
# React Router, com os dois domínios (e os www). Os redirects por domínio são gerados no build (scripts/dominios.mjs →
# build/client/_redirects, lidos antes destes). Guia: site/LEIA.md
# No painel do Netlify: Base directory = site (o resto vem deste arquivo).

[build]
  base = "site"
  # O Netlify instala as dependências pelo package-lock.json (npm) antes deste comando.
  command = "npm run build"
  publish = "build/client"
  # Só monta quando algo dentro de site/ mudou (o motor e o banco não disparam deploy).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  # Supabase do site: URL e chave anon são públicas (vão no JavaScript do navegador; quem protege é a RLS).
  # Nunca coloque aqui a chave service_role.
  VITE_SUPABASE_URL = "https://jxwppkrkuckfwmphqjva.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4d3Bwa3JrdWNrZndtcGhxanZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTc3NTIsImV4cCI6MjEwNTkzMzc1Mn0.nLtZW67zleBlLB-wyUQYQnLtuqQ6-mMr0gzc3g6jFuU"
  # Canonical das telas do sistema. O site público usa https://motorcx.com.br (src/lib/dominios.ts).
  VITE_SITE_ORIGIN = "https://motorcob.online"
  # Treino por voz do Roleplay (SQL 119): o WebSocket seguro das duas VMs de voz, um endereço exato por VM, que a CSP
  # libera em connect-src (scripts/cabecalhos.mjs). Trocou o IP ou o domínio da VM: troque aqui e no secret
  # VOZ_TREINO_WS_URL da Edge Function treino.
  TREINO_VOZ_WSS = "wss://35-198-40-10.sslip.io:8443 wss://34-39-217-31.sslip.io:8443"

# www → domínio sem www (antes era o loader da raiz, com 308)
[[redirects]]
  from = "https://www.motorcob.online/*"
  to = "https://motorcob.online/:splat"
  status = 301
  force = true

# SPA: toda rota que não é arquivo abre o index.html e o React Router resolve no navegador.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos de segurança de todas as páginas. A Content-Security-Policy NÃO fica aqui: ela é gerada a cada build
# (scripts/cabecalhos.mjs) em build/client/_headers, com o hash SHA-256 dos scripts inline do index.html (mudam a cada
# build), e o Netlify aplica os dois juntos. Origens liberadas e o porquê: comentário do scripts/cabecalhos.mjs.
# HSTS: 1 ano, com subdomínios (todo *.motorcob.online precisa ter HTTPS; sem preload por enquanto).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # microfone só na própria origem: o treino por voz do Roleplay (/treino/... e Speech › Roleplay) pede no navegador
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Link = "<https://motorcx.com.br/sitemap.xml>; rel=\"sitemap\"; type=\"application/xml\""

# Arquivos do build têm hash no nome: cache longo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
